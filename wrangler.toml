#:schema node_modules/wrangler/config-schema.json

# ══════════════════════════════════════════════════════════════
#  ZFSN 站点 —— Cloudflare Worker（静态资源 + API 一体）
#
#  迁移前：页面托管在 Cloudflare Workers（纯静态），
#          留言/作品/上传等动态功能由家里电脑上的 Node 后端提供，
#          经 cloudflared 隧道回到 127.0.0.1:3000 —— 电脑一关，站就残了。
#  迁移后：同一个 Worker 既发静态资源，又提供 /api/*，
#          数据落 D1、媒体落 R2，家里电脑关机也不影响线上。
#
#  database_id 要换成你自己的：跑 `npx wrangler d1 create zfsn-db`
#  之后把输出的 id 填到下面。这一步在 DEPLOY.md 里有详细说明。
# ══════════════════════════════════════════════════════════════

# ⚠ 必须是 zfsn —— 线上自定义域名 www.zfsnnb.dpdns.org 绑的是这个 Worker，
# 它接了 GitHub 自动构建（推 main 后约 1 分钟自动重建）。
# 早前这里写成 zfsn-site，导致手动 deploy 建出一个同名旁支 Worker，
# 线上完全没生效（改了代码却"没反应"就是这么来的）。
name = "zfsn"
main = "src/index.js"
compatibility_date = "2026-09-01"

# 静态资源：默认先查静态资源、命中直接返回（不经过 Worker）。
# 排除清单（.git / src / tools / node_modules …）见 .assetsignore。
[assets]
directory = "."
# ★ binding = "ASSETS" 是**必须的**，不是可选优化。
#   少了它，`env.ASSETS` 在 Worker 里是 undefined，`env.ASSETS.fetch()` 直接抛
#   TypeError。而默认（run_worker_first 未开）时静态层自己就把文件发了，
#   src/index.js 里的 serveAsset 根本没被走到 —— 所以站点看起来一切正常，
#   **这个缺失可以潜伏很久，一旦打开 run_worker_first 就整站 HTML 404。**
#   （2026-10-05 为修 workers.dev 的 301 打开它，才暴出整站 404；
#     此前三次"修补全逻辑"全在错误方向上打转，真因就在这一行。）
#   wrangler 对此有明确警告：
#     ▲ [WARNING] run_worker_first=true set without an assets binding
binding = "ASSETS"

# ★ 只让**这几个 HTML 页面**先进 Worker，以便对 workers.dev 做 301。
#
#   为什么不全局 run_worker_first = true：
#   隔离 wrangler dev 对照实验（2026-10-05）实测全局开会**让 `_headers` 失效**
#   —— 图片拿不到 `Cache-Control: public, max-age=2592000`，
#   退回 `max-age=0, must-revalidate`，图片缓存全废。
#   路径列表模式两者兼得：HTML 走 Worker（301 生效）+ 图片仍由静态层直出
#   （`_headers` 规则照常生效，已实测确认）。
#
#   实测确认：有了 binding 之后，ASSETS 的映射**完全正常**，
#   并不需要任何手动补全：
#     /                         -> index.html         200
#     /index.html               -> index.html         200
#     /pvz/pvz-portable         -> pvz-portable.html  200（无扩展名自动映射）
#
#   ⚠ 以后**新增无扩展名的 HTML 页面**必须同时加进这个列表，否则不会被 301 覆盖。
run_worker_first = [
  "/",
  "/index.html",
  "/admin",
  "/admin/",
  "/admin/index.html",
  "/pvz/pvz-portable",
  "/pvz/pvz-portable.html",
  "/googleb9db891307fd40eb.html",
  # ZF语音：独立页面。加进白名单才能享受 workers.dev → 规范域名 301，
  # 并为阶段 2 的服务端会话判断（未登录只返回登录壳）留出入口。
  "/voice",
  "/voice/",
  "/voice/index.html",
  # 独立登录页：Worker 把同一份 index.html 映射过来，必须自己进白名单，
  # 否则静态层找不到 /voice/login 这个文件会直接 404。
  "/voice/login",
  "/voice/login/",
  "/voice.html",
]

# 图片长缓存写在仓库根目录的 `_headers` 里，不在这里、也不在 src/index.js
# —— 上面 run_worker_first 的例外只有那几个 HTML 页面，
#   其余（图片/CSS/JS）仍然静态层直出，_headers 照常生效。

[[d1_databases]]
binding = "DB"              # 代码里用 env.DB
database_name = "zfsn-db"
database_id = "6e6ae2a5-0ac9-4be7-b2df-5d2cdb03720c"

# 媒体存储。原本用 R2，但 R2 开通要绑支付方式，改用免费版 KV。
# 免费额度：1 GB 存储 / 10 万次读 / 1 千次写，单值上限 25 MiB
# （所以 src/media.js 里对大文件做了 8 MiB 分片）。
[[kv_namespaces]]
binding = "MEDIA"           # 代码里用 env.MEDIA
id = "43b4e1c0827542dc88da95cce8f3796b"

# ══ ZF语音：Durable Object（房间状态 / 信令 / 设置实时下发）══════
# 生产后端只有 Cloudflare Worker；用户的电脑只是浏览器客户端，
# 负责「添加私有频道」，不跑任何常驻服务。
# 首次部署必须先应用这条迁移（否则 env.VOICE_ROOM 为空，语音降级为提示）。
[[durable_objects.bindings]]
name = "VOICE_ROOM"
class_name = "VoiceRoomDO"

[[migrations]]
tag = "v1"
# 官方 2026 文档对新建 DO 推荐 new_sqlite_classes（SQLite 后端），
# 不再用旧版 new_classes。本 DO 只用 WebSocket Hibernation + attachment，
# 不依赖旧 KV 存储；本模块尚未上线，可直接采用推荐写法。
new_sqlite_classes = ["VoiceRoomDO"]

[vars]
# PBKDF2 迭代次数（SHA-512）。
#
# ⚠ 100000 是 Workers 运行时的**硬上限**，不是随便挑的值：
#   超过就抛 "Pbkdf2 failed: iteration counts above 100000 are not supported"，
#   登录直接失败。这是 workerd 的保护机制，升级套餐也不放宽。
#   （实测过：120000 轮必定报错。）
#
# 好消息是 PBKDF2 在原生加密层执行，不占那 10ms CPU 配额，10 万轮没有问题。
#
# 从旧后端 data/config.json 平移来的哈希是 120000 轮，在 Workers 上
# 根本无法校验，**必须**用 `npm run password` 按 100000 轮重设一次。
PBKDF2_ITERATIONS = 100000

# ══ Turnstile 留言防灌水 ══════════════════════════════════════════
# 启用步骤：
#   1. Cloudflare 控制台 → Turnstile → Add site
#      域名填 www.zfsnnb.dpdns.org（Widget Mode 用 Managed）
#   2. 把拿到的 Site Key 填到下面 TURNSTILE_SITE_KEY（公开值，可进 git）
#   3. Secret Key 用 `npx wrangler secret put TURNSTILE_SECRET_KEY`
#      （保密值，绝不进 git；线上 Worker 读取）
#   4. 本地 wrangler dev 调试时同理：`npx wrangler dev --var TURNSTILE_SECRET_KEY:xxx`
# 两个值都配好即生效；留空则前后端都自动跳过，留言流程和从前一样。
TURNSTILE_SITE_KEY = ""
# TURNSTILE_SECRET_KEY —— 不要写在这里！用 `wrangler secret put` 配置。

# 时间戳显示用的时区偏移（北京 = +8）。
# Workers 运行时是 UTC，不偏移的话留言时间会早 8 小时。
TZ_OFFSET = 8

# 归属地数据源：
#   cf     —— 用 request.cf（Cloudflare 边缘自带，零延迟、不依赖外部 API）
#   ipapi  —— 回落到 ip-api.com（中文省/市更全，但有 45 次/分钟限流）
GEO_SOURCE = "cf"

# ══ ZF语音 密钥（阶段 2）══════════════════════════════════════════
# 下列三项都是保密值，**不要写在这个文件里**，用 `npx wrangler secret put <名字>`：
#   TURNSTILE_SECRET_KEY   后台把人机验证切到 Turnstile 时必须配置；
#                          未配置时服务端会拒绝切换（留言防灌水也共用它）
#   VOICE_CAPTCHA_SECRET   自制验证码答案哈希的站点盐；不配置会用内置常量，
#                          安全性下降但功能可用，生产建议配置
#   VOICE_TURNSTILE_SITE_KEY  Turnstile 的公开 Site Key（也可复用上面已有的
#                          TURNSTILE_SITE_KEY；两者都为空时前端会给出中文提示）
# 首个 ZF语音管理员用一次性脚本创建，不在代码里写死密码（按此顺序）：
#   1) npm run voice:d1                 # 先执行 schema/0003_voice.sql 建表
#   2) $env:VOICE_ADMIN_USERNAME="admin"; $env:VOICE_ADMIN_PASSWORD="强密码"
#      npm run voice:init-admin         # 只生成含密码哈希的 SQL，明文不落盘
#   3) npx wrangler d1 execute zfsn-db --remote --file=./tools/migrate/voice_admin_init.sql
#   4) 删除 tools/migrate/voice_admin_init.sql 并清除环境变量
#
# ══ ZF语音：实时媒体密钥（阶段 3~6）═════════════════════════════
# 以下全部是保密值，用 `npx wrangler secret put <名字>` 注入，切勿写进本文件：
#   VOICE_ROOM_SECRET           房间 WebSocket 票据的 HMAC 密钥（强烈建议配置）
#   REALTIME_SFU_APP_ID         Cloudflare 控制台 Realtime > Serverless SFU 的 App ID
#   REALTIME_SFU_APP_SECRET     同页生成的 App Secret（Bearer，只放 Worker）
#   TURN_KEY_ID                 Cloudflare Realtime TURN Key 的 ID（可选）
#   TURN_KEY_API_TOKEN          TURN Key 的 API Token（可选）
#   LIVEKIT_API_KEY             可选高级模式：自建 LiveKit 的 API Key
#   LIVEKIT_API_SECRET          可选高级模式：自建 LiveKit 的 API Secret
# 未配置 SFU 时页面仍可用「本地直连降级模式」，但线上多人通话必须配置 SFU。
# 详见 docs/voice-deploy.md（中文部署文档）。
