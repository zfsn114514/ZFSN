#:schema node_modules/wrangler/config-schema.json

# ══════════════════════════════════════════════════════════════
#  ZFSN 站点 —— Cloudflare Worker（静态资源 + API 一体）
#
#  迁移前：页面托管在 Cloudflare Workers（纯静态），
#          留言/作品/上传等动态功能由家里电脑上的 Node 后端提供，
#          经 cloudflared 隧道回到 127.0.0.1:3000 —— 电脑一关，站就残了。
#  迁移后：同一个 Worker 既发静态资源，又提供 /api/*，
#          数据落 D1、媒体落 R2，家里电脑关机也不影响线上。
#
#  database_id 要换成你自己的：跑 `npx wrangler d1 create zfsn-db`
#  之后把输出的 id 填到下面。这一步在 DEPLOY.md 里有详细说明。
# ══════════════════════════════════════════════════════════════

# ⚠ 必须是 zfsn —— 线上自定义域名 www.zfsnnb.dpdns.org 绑的是这个 Worker，
# 它接了 GitHub 自动构建（推 main 后约 1 分钟自动重建）。
# 早前这里写成 zfsn-site，导致手动 deploy 建出一个同名旁支 Worker，
# 线上完全没生效（改了代码却"没反应"就是这么来的）。
name = "zfsn"
main = "src/index.js"
compatibility_date = "2026-09-01"

# 静态资源：默认先查静态资源、命中直接返回（不经过 Worker）。
# 排除清单（.git / src / tools / node_modules …）见 .assetsignore。
[assets]
directory = "."

# 图片长缓存写在仓库根目录的 `_headers` 里，不在这里、也不在 src/index.js
# —— 静态资源层的请求优先于 Worker，代码里设 Cache-Control 对已存在的
# 文件是无效的。
#
# 另：曾试过 run_worker_first = ["/assets/*"] 在 Worker 里做 webp 格式协商，
# 但图片路径散落在 HTML / JSON / D1 里，换扩展名（.png → .webp）会让这些
# 引用直接 404。现改为离线「原地压缩、保留扩展名」，
# 见 tools/dev/optimize_images.py。

[[d1_databases]]
binding = "DB"              # 代码里用 env.DB
database_name = "zfsn-db"
database_id = "6e6ae2a5-0ac9-4be7-b2df-5d2cdb03720c"

# 媒体存储。原本用 R2，但 R2 开通要绑支付方式，改用免费版 KV。
# 免费额度：1 GB 存储 / 10 万次读 / 1 千次写，单值上限 25 MiB
# （所以 src/media.js 里对大文件做了 8 MiB 分片）。
[[kv_namespaces]]
binding = "MEDIA"           # 代码里用 env.MEDIA
id = "43b4e1c0827542dc88da95cce8f3796b"

[vars]
# PBKDF2 迭代次数（SHA-512）。
#
# ⚠ 100000 是 Workers 运行时的**硬上限**，不是随便挑的值：
#   超过就抛 "Pbkdf2 failed: iteration counts above 100000 are not supported"，
#   登录直接失败。这是 workerd 的保护机制，升级套餐也不放宽。
#   （实测过：120000 轮必定报错。）
#
# 好消息是 PBKDF2 在原生加密层执行，不占那 10ms CPU 配额，10 万轮没有问题。
#
# 从旧后端 data/config.json 平移来的哈希是 120000 轮，在 Workers 上
# 根本无法校验，**必须**用 `npm run password` 按 100000 轮重设一次。
PBKDF2_ITERATIONS = 100000

# 时间戳显示用的时区偏移（北京 = +8）。
# Workers 运行时是 UTC，不偏移的话留言时间会早 8 小时。
TZ_OFFSET = 8

# 归属地数据源：
#   cf     —— 用 request.cf（Cloudflare 边缘自带，零延迟、不依赖外部 API）
#   ipapi  —— 回落到 ip-api.com（中文省/市更全，但有 45 次/分钟限流）
GEO_SOURCE = "cf"
