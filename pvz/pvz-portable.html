<script>
window.moduleReadyPromise = new Promise((function (n, e) {
  window._resolveModuleReady = n;
  window._rejectModuleReady = e;
}));

var Module = {
  canvas: document.getElementById("canvas"),
  noInitialRun: true,
  onRuntimeInitialized: function () { window._resolveModuleReady(); },
  onAbort: function (n) { window._rejectModuleReady(new Error(n)); },
  print: function (n) { console.log(n); },
  printErr: function (n) { console.warn(n); }
};
Module.canvas.addEventListener("contextmenu", function (n) { n.preventDefault(); });

<script src="pvz-portable.js" async></script>

<script>
"use strict";
/* ══════════════════════════════════════════════════════════════
   ZFSN 版启动逻辑
   与上游 pvz-portable.html 的唯一区别：去掉了「上传资源」界面，
   改为启动时自动从 /pvz/ 拉取 main.pak 分片 + properties/，
   在浏览器里拼成完整 pak 写进 Emscripten 虚拟文件系统后开跑。
   ══════════════════════════════════════════════════════════════ */

var PAK_PARTS = 6;
var PROPS = ["properties/LawnStrings.txt", "properties/default.xml", "properties/partner_logo.jpg"];

var barEl = document.getElementById("bar").firstElementChild;
var pctEl = document.getElementById("pct");
var errEl = document.getElementById("err");
var boot = document.getElementById("boot");
var container = document.getElementById("canvas-container");
var canvas = document.getElementById("canvas");

var savesMounted = false, saveFsReadyPromise = null;
var syncTimer = null, syncing = null, syncQueued = false, lastSyncAt = 0;
var SYNC_INTERVAL = 5000, CLOSE_GRACE = 7000;

/* 总进度：引擎 1 + 分片 6 + properties 3 + 写入/合并阶段权重 */
var TOTAL_STEPS = PAK_PARTS + PROPS.length + 6;

function setProgress(step, text) {
  var p = Math.min(100, Math.round(step / TOTAL_STEPS * 100));
  barEl.style.width = p + "%";
  pctEl.textContent = (text ? text + " · " : "") + p + "%";
}

function fail(e, stage) {
  console.error(e);
  // 异常可能不是 Error（DOMException、字符串、Event），都还原成可读文本
  var msg = "";
  try {
    if (e && typeof e === "object") {
      msg = e.message || e.reason || (e.name ? e.name + ": " + e.message : "");
      if (!msg) msg = Object.prototype.toString.call(e);
    } else {
      msg = String(e);
    }
  } catch (_) { msg = "未知错误"; }
  errEl.style.display = "block";
  errEl.innerHTML = "<b>启动失败</b>" + (stage ? "（阶段：<code>" + stage + "</code>）" : "") + "：<br>" + msg +
    "<br><br>如果反复失败，通常是网络中断或浏览器内存不足（这个游戏需要约 200 MB 内存）。" +
    "可以试着刷新页面，或换桌面版浏览器打开。";
  pctEl.textContent = "已中断 · " + (stage ? stage + " · " : "") + msg.slice(0, 80);
  document.getElementById("retry").style.display = "inline-block";
}

/* 建目录（含 p 自身）。Emscripten 的 mkdir 不会建父目录，也不能重复建。 */
function mkdirp(p) {
  var parts = String(p).split("/").filter(Boolean);
  var cur = "";
  for (var i = 0; i < parts.length; i++) {
    cur += "/" + parts[i];
    try {
      Module.FS.mkdir(cur);
    } catch (e) {
      // EEXIST(20) 正常；其他错误必须看到，否则后面 writeFile 才报 ErrnoError
      if (e && e.errno !== 20 && e.errno !== 17) {
        console.warn("[pvz] mkdir " + cur + " 异常:", e && e.name, "errno=" + (e && e.errno));
        throw e;
      }
    }
  }
}

function fetchPart(i) {
  var name = "mainpak/part." + ("0" + i).slice(-2);
  return fetch(name).then(function (r) {
    if (!r.ok) throw new Error(name + " 拉取失败（HTTP " + r.status + "）");
    return r.arrayBuffer();
  });
}

function fetchProp(path) {
  return fetch(path).then(function (r) {
    if (!r.ok) throw new Error(path + " 拉取失败（HTTP " + r.status + "）");
    return r.arrayBuffer();
  });
}

/* ── 存档：IndexedBFFS ── */
function canSync() { return savesMounted && Module.FS && typeof Module.FS.syncfs === "function"; }

function ensureSaveFs() {
  if (saveFsReadyPromise) return saveFsReadyPromise;
  saveFsReadyPromise = (async function () {
    await window.moduleReadyPromise;
    try {
      Module.FS.mkdir("/saves");
    } catch (e) { console.warn("[pvz] mkdir /saves:", e && e.name); }
    try {
      Module.FS.mount(Module.FS.filesystems.IDBFS, {}, "/saves");
      savesMounted = true;
    } catch (e) {
      // 隐私模式 / 存储被禁用时 IDBFS 会挂不上。这不该阻断游戏 ——
      // 只是存不了档而已，play 优先。
      console.warn("[pvz] IDBFS 挂载失败，本次不启用存档:", e && e.name);
      savesMounted = false;
      return;
    }
    await new Promise(function (res) {
      try {
        Module.FS.syncfs(true, function (err) { if (err) console.warn("IDBFS 初始同步:", err); res(); });
      } catch (e) { console.warn("[pvz] syncfs 抛错:", e); res(); }
    });
    lastSyncAt = Date.now();
  })();
  return saveFsReadyPromise;
}

function syncSaves() {
  if (!canSync()) return;
  if (syncing) { syncQueued = true; return; }
  syncing = new Promise(function (res) {
    try {
      Module.FS.syncfs(false, function (err) {
        if (err) console.warn("IDBFS 写入:", err); else lastSyncAt = Date.now();
        res();
      });
    } catch (e) {
      // 存档写失败不能影响游戏运行，静默降级为「本次不存档」
      console.warn("[pvz] syncfs 抛错，停止本次存档同步:", e && e.name);
      savesMounted = false;
      res();
    }
  }).then(function () {
    syncing = null;
    if (syncQueued) { syncQueued = false; syncSaves(); }
  });
}

function startAutosync() {
  if (syncTimer === null) syncTimer = window.setInterval(syncSaves, SYNC_INTERVAL);
}

function collectFiles(dir) {
  var out = [], names;
  try { names = Module.FS.readdir(dir); } catch (e) { return out; }
  for (var i = 0; i < names.length; i++) {
    var n = names[i];
    if (n === "." || n === "..") continue;
    var full = dir + "/" + n, st = Module.FS.stat(full);
    if (Module.FS.isDir(st.mode)) out = out.concat(collectFiles(full));
    else out.push(full);
  }
  return out;
}

/* 手写 ZIP（store 模式）—— 省掉上游用的 JSZip CDN 依赖 */
var CRC_TABLE = (function () {
  var t = new Uint32Array(256);
  for (var n = 0; n < 256; n++) {
    var c = n;
    for (var k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();

function crc32(bytes) {
  var crc = 0xFFFFFFFF;
  for (var i = 0; i < bytes.length; i++) {
    crc = (crc >>> 8) ^ CRC_TABLE[(crc ^ bytes[i]) & 255];
  }
  return (crc ^ 0xFFFFFFFF) >>> 0;
}

function u16(v) { return [v & 255, (v >>> 8) & 255]; }
function u32(v) { return [v & 255, (v >>> 8) & 255, (v >>> 16) & 255, (v >>> 24) & 255]; }

function exportSaves() {
  var btn = document.getElementById("btn-export");
  btn.disabled = true; btn.textContent = "⏳ 导出中…";
  ensureSaveFs().then(syncSaves).then(function () {
    var files = collectFiles("/saves/userdata");
    if (!files.length) { alert("还没有存档数据。玩一局后再导出吧。"); return; }
    var chunks = [], central = [], offset = 0;
    var DOS_TIME = 0, DOS_DATE = 33; // 1980-01-01，固定值
    files.forEach(function (p) {
      var data = Module.FS.readFile(p);
      var nameBytes = new Uint8Array(p.length);
      for (var i = 0; i < p.length; i++) nameBytes[i] = p.charCodeAt(i) & 255;
      var crc = crc32(data);
      var local = new Uint8Array([].concat(
        u32(0x04034b50), u16(20), u16(0), u16(0), u16(0), u16(DOS_TIME), u16(DOS_DATE),
        u32(crc), u32(data.length), u32(data.length), u16(nameBytes.length), u16(0)
      ));
      chunks.push(local, nameBytes, data);
      var cen = new Uint8Array([].concat(
        u32(0x02014b50), u16(20), u16(20), u16(0), u16(0), u16(0), u16(DOS_TIME), u16(DOS_DATE),
        u32(crc), u32(data.length), u32(data.length), u16(nameBytes.length),
        u16(0), u16(0), u16(0), u16(0), u32(0), u32(offset)
      ));
      central.push(cen, nameBytes);
      offset += local.length + nameBytes.length + data.length;
    });
    var centralSize = central.reduce(function (a, b) { return a + b.length; }, 0);
    var end = new Uint8Array([].concat(
      u32(0x06054b50), u16(0), u16(0), u16(files.length), u16(files.length),
      u32(centralSize), u32(offset), u16(0)
    ));
    chunks.push(end);
    var url = URL.createObjectURL(new Blob(chunks, { type: "application/zip" }));
    var a = document.createElement("a");
    a.href = url; a.download = "pvz-savedata.zip"; a.click();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }).catch(function (e) {
    alert("导出失败：" + (e.message || e));
  }).then(function () {
    btn.disabled = false; btn.textContent = "💾 导出存档";
  });
}

function resizeCanvas() {
  var s = Math.min(container.clientWidth / canvas.width, container.clientHeight / canvas.height);
  canvas.style.width = Math.floor(canvas.width * s) + "px";
  canvas.style.height = Math.floor(canvas.height * s) + "px";
}

/* ── 软键盘输入（仅用于新建用户时打字） ──
 * 这版 Emscripten 用的是「软键盘」方案，游戏**只读**隐藏 textarea
 * #pvz-soft-keyboard 的内容，不看键盘事件：
 *   · 监听 textarea 的 input 事件，把 value 的增量推进 pendingChars
 *   · wasm 每帧调 WasmHasSoftKeyboardEvents / WasmPopSoftKeyboardChar 取字符
 * 所以派发 KeyboardEvent 游戏收不到（我先试了 document.dispatchEvent，
 * 又试了 CDP 的 Input.dispatchKeyEvent 走真实输入管线，都无效）。
 *
 * ⚠ 另一个坑：state.active 只在「有文本框」时为 true，新建用户输入姓名时
 * 游戏才会自己打开。其它画面往里投字符会被丢弃 —— 这也是当初那个
 * `future` 作弊码方案失败的原因之一（另一个原因是这版没有选关地图画面）。
 */

function gameRunning() {
  return !!(Module && Module && Module.FS && container && container.style.display === "flex");
}

/* 往软键盘 textarea 追加字符 —— 游戏真正认的输入通道。
 *
 * 两个前提，缺一不可：
 *   ① state 必须已创建（WasmStartSoftKeyboard 被游戏调过一次）
 *   ② state.active 必须为 true —— 游戏每帧轮询 HasSoftKeyboardEvents，
 *      active=false 时它根本不来取字符，投进去也是白投
 * 而 active 只在「有文本框」时为 true（比如新建用户输入姓名）。
 * 选关地图没有文本框，所以要自己把 state 打开。
 */
function typeViaSoftKeyboard(str) {
  var input = document.getElementById("pvz-soft-keyboard");
  if (!input) return false;
  var state = Module.wasmSoftKeyboardState;
  if (!state) {
    // 游戏一次都没开过软键盘（连新建用户都没走到）。
    // 按 WasmStartSoftKeyboard 的样子自建一份，字段名保持一致。
    state = Module.wasmSoftKeyboardState = {
      active: false, pendingChars: [], pendingKeys: [], lastValue: "",
    };
    input.addEventListener("input", function () {
      if (!state.active) return;
      var next = input.value || "";
      var lastChars = Array.from(state.lastValue);
      var nextChars = Array.from(next);
      var prefixLen = 0;
      while (prefixLen < lastChars.length && prefixLen < nextChars.length &&
             lastChars[prefixLen] === nextChars[prefixLen]) prefixLen++;
      for (var i = lastChars.length; i > prefixLen; --i) state.pendingKeys.push(8);
      for (const ch of nextChars.slice(prefixLen)) {
        var cc = ch.codePointAt(0);
        if (cc > 0 && cc <= 127) state.pendingChars.push(cc);
      }
      state.lastValue = next;
    });
  }

  var wasActive = state.active;
  if (!wasActive) {
    // 自己接管软键盘：清空缓冲、标记激活、聚焦。
    // 这几步等价于 WasmStartSoftKeyboard 内部做的事。
    state.active = true;
    state.pendingChars.length = 0;
    state.pendingKeys.length = 0;
    state.lastValue = "";
    input.value = "";
    try { input.focus(); } catch (e) { /* 忽略 */ }
  }

  var i = 0;
  (function step() {
    if (i >= str.length) {
      // 送完就还原，别打扰游戏后续的正常输入判定
      if (!wasActive) {
        setTimeout(function () {
          state.active = false;
          input.value = "";
          state.lastValue = "";
        }, 1200);
      }
      return;
    }
    // 每次只多写一个字符：syncInputValue 靠「与上次值的公共前缀」算增量，
    // 逐字符送更接近真人输入，也更稳妥。
    input.value = str.slice(0, i + 1);
    input.dispatchEvent(new Event("input", { bubbles: true }));
    i++;
    setTimeout(step, 260);
  })();
  return true;
}

/* ── 通关存档 ──
 * 做法：直接按源码格式**构造** user{N}.dat 写进 IDBFS。
 *
 * 为什么不用作弊码（这是踩过的坑，留个记录）：
 *   原方案是往软键盘 textarea 里打原版作弊码 `future`，指望游戏
 *   自己解锁并落盘。实测行不通，原因不是输入通道不对，而是
 *   **这版没有原版那个选关地图画面** —— 点 ADVENTURE 直接进关卡实战，
 *   而 `future` 只在选关地图被消费，进去就必然被丢弃。
 *
 * 为什么现在能直接构造：
 *   游戏引擎是开源的 PvZ-Portable（github.com/wszqkzqk/PvZ-Portable, LGPL），
 *   存档格式在 src/Lawn/System/PlayerInfo.cpp 的 PlayerInfo::SyncDetails 里
 *   写得很清楚，而且官方声明 user{N}.dat 与原版 GOTY **100% 二进制兼容**。
 *   结构是紧凑小端、无文件头，见 save-builder.js 的逐字段注释。
 *   实测：写入 886 字节后重载，游戏正常读入（无 "Failed to player data"），
 *   主菜单显示 WELCOME BACK，剧情与解锁状态全部生效。
 *
 * 为什么必须「写完要求刷新」：
 *   PlayerInfo 是游戏启动时一次性加载进内存的。运行中改 IDBFS 里的文件，
 *   游戏内存里那份不会变。写盘 + 刷新页面，游戏才会重新读档。
 */
function applyFullUnlock() {
  var btn = document.getElementById("btn-unlock");
  if (!gameRunning()) {
    alert("游戏还没加载完，等进度条走完再试。");
    return;
  }
  if (typeof buildUnlockedUserDat !== "function") {
    alert("存档构造器没加载成功（save-builder.js），请刷新页面重试。");
    return;
  }

  // 沿用现有 profile 的名字和 id，这样不会覆盖成陌生账号
  var name = "Player", useSeq = 1, profileId = 1;
  try {
    var cur = Module.FS.readFile("/saves/userdata/users.dat");
    var dv = new DataView(cur.buffer, cur.byteOffset, cur.byteLength);
    if (dv.getUint32(0, true) === SAVE_PROFILE_VERSION) {
      var count = dv.getUint16(4, true);
      if (count > 0) {
        var nameLen = dv.getUint16(6, true);
        name = "";
        for (var i = 0; i < nameLen; i++) name += String.fromCharCode(dv.getUint8(7 + i));
        useSeq = dv.getUint32(8 + nameLen, true);
        profileId = dv.getUint32(12 + nameLen, true);
      }
    }
  } catch (e) {
    // 没有 users.dat 就用默认值，新建一个 profile
  }

  var userDat, usersDat, info;
  try {
    userDat = buildUnlockedUserDat();
    usersDat = buildUsersDat(name, useSeq, profileId);
    info = inspectUserDat(userDat);
  } catch (e) {
    alert("构造存档失败：" + (e && e.message ? e.message : e));
    return;
  }
  if (info.version !== SAVE_USER_VERSION) {
    alert("构造的存档版本不对，已中止。");
    return;
  }

  btn.disabled = true;
  btn.textContent = "⏳ 解锁中…";

  var file = "user" + profileId + ".dat";
  try {
    Module.FS.mkdir("/saves/userdata");
  } catch (e) { /* 已存在 */ }
  Module.FS.writeFile("/saves/userdata/" + file, userDat);
  Module.FS.writeFile("/saves/userdata/users.dat", usersDat);

  syncSaves().then(function () {
    btn.disabled = false;
    btn.textContent = "🔓 通关存档";
    alert(
      "全解锁存档已写入并落盘 ✅\n\n" +
      "· 存档文件：" + file + "（" + info.size + " 字节）\n" +
      "· 账号：" + name + "（id " + profileId + "）\n" +
      "· 冒险模式：第 1–" + SAVE_FINAL_LEVEL + " 关全部解锁\n" +
      "· 金币：" + info.coins + "\n" +
      "· 小游戏 / 益智 / 生存模式：已解锁\n" +
      "· 商店：全部道具已购买\n" +
      "· 成就：20/20\n\n" +
      "现在需要**刷新页面**——游戏只在启动时读一次存档，\n" +
      "运行中改文件不会影响内存里那份。\n\n" +
      "刷新后主菜单应显示 WELCOME BACK，进入冒险模式即可看到全解锁。"
    );
  });
}

async function boot0() {
  var STAGE = "init";
  try {
    setProgress(1, "加载引擎");
    await window.moduleReadyPromise;
    setProgress(2, "引擎就绪");

    /* 并行拉取 6 个分片 + 3 个 properties */
    STAGE = "下载素材";
    var jobs = [];
    for (var i = 0; i < PAK_PARTS; i++) jobs.push(fetchPart(i));
    for (var j = 0; j < PROPS.length; j++) jobs.push(fetchProp(PROPS[j]));

    var got = 2, step = 0;
    var loaded = await Promise.all(jobs.map(function (p) {
      return p.then(function (v) { got++; setProgress(got, "下载资源"); return v; });
    }));

    /* 分片逐个写进 FS（避免一次性 44MB Uint8Array 在移动端分配失败） */
    STAGE = "写入分片";
    mkdirp("/parts");
    for (var k = 0; k < PAK_PARTS; k++) {
      Module.FS.writeFile("/parts/" + k, new Uint8Array(loaded[k]));
      setProgress(++step + PAK_PARTS + 3, "写入分片 " + (k + 1) + "/" + PAK_PARTS);
    }

    /* properties 原样写入。
     * 注意：引擎的 wasm 里**已经打包了 properties/ 目录**（Emscripten FS 预置），
     * 所以这里不能 mkdir（会 EEXIST），也绝不能对已存在的目录 writeFile
     * （会 EISDIR，errno=31）。目录存在就直接写文件。 */
    STAGE = "写入素材配置";
    console.log("[pvz] 根目录内容:", Module.FS.readdir("/").join(","));
    for (var m = 0; m < PROPS.length; m++) {
      var ppath = "/" + PROPS[m];
      try {
        // 只有父目录不存在时才建（已存在就跳过）
        var pdir = ppath.slice(0, ppath.lastIndexOf("/"));
        try { Module.FS.stat(pdir); } catch (e) { mkdirp(pdir); }
        Module.FS.writeFile(ppath, new Uint8Array(loaded[PAK_PARTS + m]));
      } catch (err) {
        throw new Error("写入 " + ppath + " 失败: " + (err && err.name) +
          "（errno=" + (err && err.errno) + "）");
      }
    }
    setProgress(PAK_PARTS + 4, "素材就绪");

    /* 在引擎内拼成完整 main.pak */
    STAGE = "合并 pak";
    var sizes = [], total = 0;
    for (var q = 0; q < PAK_PARTS; q++) {
      var s = Module.FS.stat("/parts/" + q).size;
      sizes.push(s); total += s;
    }
    console.log("[pvz] 分片大小:", sizes, "合计:", total);

    /* 在引擎内拼成完整 main.pak。
     * 不用 readFile 的随机读（{position,length}）—— 这个 Emscripten 版本的
     * readFile 似乎不认那个参数，会抛 "offset is out of bounds"。
     * 每个分片只有 8MB，直接整块读出来更稳。 */
    var pieces = [];
    for (var r = 0; r < sizes.length; r++) {
      var chunk = Module.FS.readFile("/parts/" + r);
      if (chunk.length !== sizes[r]) {
        throw new Error("分片 " + r + " 读取长度不符: " + chunk.length + " != " + sizes[r]);
      }
      pieces.push(chunk);
      setProgress(PAK_PARTS + 4 + r, "合并 pak " + (r + 1) + "/" + PAK_PARTS);
    }
    var merged = new Uint8Array(total), pos = 0;
    for (var t = 0; t < pieces.length; t++) { merged.set(pieces[t], pos); pos += pieces[t].length; }

    STAGE = "写入 main.pak";
    Module.FS.writeFile("/main.pak", merged);

    /* 校验大小 —— 拼错的话游戏会花屏而不是报错，这里显式拦一道 */
    if (merged.length !== total || pos !== total) throw new Error("pak 合并长度异常");
    console.log("[pvz] main.pak 合并完成:", total, "bytes");

    /* 释放分片占用的内存 */
    for (var z = 0; z < PAK_PARTS; z++) { try { Module.FS.unlink("/parts/" + z); } catch (e) {} }
    try { Module.FS.rmdir("/parts"); } catch (e) {}

    STAGE = "恢复存档";
    setProgress(TOTAL_STEPS, "恢复存档");
    await ensureSaveFs();

    STAGE = "启动游戏";
    boot.style.display = "none";
    document.body.classList.add("game-mode");
    container.style.display = "flex";
    resizeCanvas();
    window.addEventListener("resize", resizeCanvas);
    window.addEventListener("fullscreenchange", resizeCanvas);
    lastSyncAt = Date.now();
    startAutosync();
    // callMain 之后引擎接管主循环；它内部抛错属于游戏自身问题，
    // 不该再显示「启动失败」并把 boot 恢复出来 —— 那是启动阶段的事。
    STAGE = null;
    Module.callMain([]);
  } catch (e) {
    if (STAGE === null) {
      // 游戏运行期出错：只记日志，不动界面
      console.error("[pvz] 引擎运行时异常:", e);
      return;
    }
    fail(e, STAGE);
  }
}

document.getElementById("retry").addEventListener("click", function () { location.reload(); });
document.getElementById("btn-home").addEventListener("click", function () { location.href = "/"; });
document.getElementById("btn-export").addEventListener("click", exportSaves);
document.getElementById("btn-unlock").addEventListener("click", applyFullUnlock);
document.getElementById("btn-full").addEventListener("click", function () {
  if (document.fullscreenElement) document.exitFullscreen();
  else if (container.requestFullscreen) container.requestFullscreen();
});
document.addEventListener("visibilitychange", function () { if (document.visibilityState === "hidden") syncSaves(); });
window.addEventListener("pagehide", function () { syncSaves(); });
window.addEventListener("beforeunload", function (e) {
  syncSaves();
  if (Date.now() - lastSyncAt >= CLOSE_GRACE) {
    e.preventDefault(); e.returnValue = "存档可能还没写完，等一下或先导出存档。";
  }
});

boot0();
</script>
