<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- 黄金律法光标：悬停时的赐福符环（热点在圆心 12,12） -->
  <defs>
    <filter id="g" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <circle cx="12" cy="12" r="8" fill="#d9b978" fill-opacity=".10"
          stroke="#e8c987" stroke-width="1.4" stroke-dasharray="30 8" filter="url(#g)"/>
  <circle cx="12" cy="12" r="3" fill="#f6e6bd" stroke="#8a6630" stroke-width=".8"/>
  <path d="M12 1.6v3M12 19.4v3M1.6 12h3M19.4 12h3" stroke="#e8c987" stroke-width="1.1" opacity=".9"/>
</svg>
