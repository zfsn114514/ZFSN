<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- 自定义光标：悬停可点元素时的发光圆环（热点在圆心 12,12） -->
  <defs>
    <filter id="g" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="1.3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <circle cx="12" cy="12" r="7.5" fill="#ff2d4a" fill-opacity=".14"
          stroke="#ff2d4a" stroke-width="1.7" filter="url(#g)"/>
  <circle cx="12" cy="12" r="2.6" fill="#ff2d4a"/>
</svg>
